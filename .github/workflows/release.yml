name: Release

# Builds a universal NotchKit DMG and attaches it to a GitHub release.
# Trigger it by pushing a version tag:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-release.sh "${TAG#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          DMG="build/release/NotchKit-$VERSION.dmg"
          NOTES="docs/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$DMG" "$DMG.sha256" --title "NotchKit $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" --title "NotchKit $VERSION" --generate-notes
          fi

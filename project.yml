name: NotchKit
options:
  bundleIdPrefix: com.yunusemrekorucu
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.6"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: 0.15.4
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
targets:
  NotchKit:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
        excludes:
          - "App/Info.plist"
          - "**/*.framework"
          - "**/*.framework/**"
      - path: App/ObjC
        excludes:
          - "Miscellaneous/NDNotificationCenterHackery.m"
      - path: App/PrivateHeaders
        buildPhase: none
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: LaunchAtLogin
      - package: SQLite
      - package: Yams
      - sdk: IOKit.framework
      - sdk: CoreGraphics.framework
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
      - sdk: CoreDisplay.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunusemrekorucu.NotchKit
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NotchKit.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/ObjC/Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/App/PrivateHeaders $(PROJECT_DIR)/App/ObjC/**"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/System/Library/PrivateFrameworks"
        SYSTEM_FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/System/Library/PrivateFrameworks"
        OTHER_LDFLAGS: "$(inherited) -framework OSD -framework MultitouchSupport -framework DisplayServices -framework MobileTimer -framework MobileTimerSupport -framework IMCore -framework IMSharedUtilities -framework IDS -framework FTServices -framework TelephonyUtilities"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    postBuildScripts:
      - name: Embed media adapters
        basedOnDependencyAnalysis: false
        script: |
          set -e
          MUSIC="${PROJECT_DIR}/App/Sources/Services/Music"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          for fw in MediaRemoteAdapter SapphireMediaQueue; do
            rm -rf "$DST/$fw.framework"
            cp -R "$MUSIC/$fw.framework" "$DST/"
            codesign --force --sign - "$DST/$fw.framework" || true
          done
          cp "$MUSIC/mediaremote-adapter.pl" "$MUSIC/mediaremote-queue.pl" "$DST/"
